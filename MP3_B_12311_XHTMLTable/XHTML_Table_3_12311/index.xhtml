<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <title>Menggabungkan Baris dan Kolom XHTML Table</title>
    </head>
    <body>
        <h2>Rundown Workshop Internal</h2>
        <table border="1" cellpadding="5">

                <th colspan="2">Rundown Workshop Robotika</th>
            </tr>

                <th>Waktu</th>
                <th>Kegiatan</th>
            </tr>
            <tr>
                <td>08.00-09.00</td>
                <td>Pembukaan</td>
            </tr>
            <tr>
                <td>09.00-10.00</td>
                <td>Pengantar Workshop</td>
            </tr>
            <tr>
                <td>10.00-11.00</td>
                <td rowspan="2">Mini Practice</td>
            </tr>
            <tr>
                <td>11.00-12.00</td>
            </tr>
        </table>
    </body>
</html>
