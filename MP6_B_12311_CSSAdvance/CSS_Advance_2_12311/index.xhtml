<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Workshop</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>

<body>
    <div class="container">
        <h1>Formulir Pendaftaran Workshop</h1>
        <p class="intro">
            Lengkapi data berikut untuk mendaftarkan diri sebagai peserta workshop.
            Pastikan informasi yang diberikan sudah benar.
        </p>

        <form action="" method="post" enctype="multipart/form-data">
            <h3>Data Peserta</h3>
            <table cellspacing="4" cellpadding="4">
                <tr>
                    <td><label for="nama">Nama Lengkap</label></td>
                    <td><input type="text" id="nama" name="nama" /></td>
                </tr>
                <tr>
                    <td><label for="nim">NIM</label></td>
                    <td><input type="text" id="nim" name="nim" /></td>
                </tr>
                <tr>
                    <td><strong>Jenis Kelamin</strong></td>
                    <td>
                        <input type="radio" id="laki-laki" name="jenis_kelamin" value="Laki-laki" />
                        <label for="laki-laki">Laki-laki</label>
                        <input type="radio" id="perempuan" name="jenis_kelamin" value="Perempuan" />
                        <label for="perempuan">Perempuan</label>
                    </td>
                </tr>
                <tr>
                    <td><label for="program_studi">Bidang Keahlian</label></td>
                    <td>
                        <select id="program_studi" name="program_studi">
                            <option value="Teknologi Informasi">Teknologi Informasi</option>
                            <option value="Bisnis Digital">Bisnis Digital</option>
                            <option value="Desain Komunikasi Visual">Desain Komunikasi Visual</option>
                        </select>
                    </td>
                </tr>
            </table>

            <h3>Pilihan Workshop</h3>
            <table cellspacing="4" cellpadding="4">
                <tr>
                    <td><strong>Jenis Peserta</strong></td>
                    <td>
                        <input type="radio" id="mahasiswa" name="jenis_peserta" value="Mahasiswa" />
                        <label for="mahasiswa">Mahasiswa</label>
                        <input type="radio" id="umum" name="jenis_peserta" value="Umum" />
                        <label for="umum">Umum</label>
                    </td>
                </tr>
                <tr>
                    <td><strong>Topik Pelatihan</strong></td>
                    <td>
                        <input type="checkbox" id="uiux" name="materi" value="Perancangan Antarmuka" />
                        <label for="uiux">Perancangan Antarmuka</label><br />
                        <input type="checkbox" id="web" name="materi" value="Pengembangan Aplikasi Web" />
                        <label for="web">Pengembangan Aplikasi Web</label><br />
                        <input type="checkbox" id="data" name="materi" value="Pengolahan Data" />
                        <label for="data">Pengolahan Data</label>
                    </td>
                </tr>
            </table>

            <h3>Informasi Tambahan</h3>
            <table cellspacing="4" cellpadding="4">
                <tr>
                    <td><label for="alasan">Alasan Mengikuti Workshop</label></td>
                    <td>
                        <textarea id="alasan" name="alasan" rows="8" cols="30"></textarea>
                    </td>
                </tr>
                <tr>
                    <td><strong>Jenis Pembayaran</strong></td>
                    <td>
                        <input type="radio" id="qris" name="jenis_pembayaran" value="QRIS" />
                        <label for="qris">QRIS</label>
                        <input type="radio" id="transfer" name="jenis_pembayaran" value="Transfer Bank" />
                        <label for="transfer">Transfer Bank</label>
                    </td>
                </tr>
                <tr>
                    <td><label for="bukti">Bukti Pembayaran</label></td>
                    <td><input type="file" id="bukti" name="bukti" /></td>
                </tr>
                <tr>
                    <td colspan="2" class="submit-cell">
                        <input type="submit" name="daftar" value="Daftar Workshop" />
                    </td>
                </tr>
            </table>
        </form>
    </div>
</body>
</html>
