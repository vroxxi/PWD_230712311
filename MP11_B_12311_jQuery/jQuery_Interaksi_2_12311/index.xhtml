<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Manipulasi 1</title>
    <script type="text/javascript" src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style type="text/css">
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        .hasil {
            margin-top: 15px;
            padding: 10px;
            border: 1px solid gray;
            width: 300px;
        }

        button {
            margin: 5px;
            padding: 8px;
        }
    </style>
    <script type="text/javascript">
        $(document).ready(function() {
            $("#btnHitung").click(function() {
                const nama = $("#nama").val();
                const nilai = $("#nilai").val();
                if (nama === "" || nilai === "") {
                    $("#hasilNilai")
                        .text("Nama dan Nilai harus diisi.")
                        .css("color", "red");
                } else if (nilai >=60){
                    $("#hasilNilai")
                        .text("Selamat, " + nama + "! Anda dinyatakan LULUS")
                        .css("color", "green");
                } else {
                    $("#hasilNilai")
                        .text("Maaf, " + nama + "! Anda dinyatakaan TIDAK LULUS.")
                        .css("color", "red");
                }
            });

            $("#btnHighlight").click(function() {
                $("#deskripsi").addClass("highlight");
            });
        });
    </script>
</head>
<body>
    <h2>Menghitung Nilai Mahasiswa</h2>
    <h3>1. Cek Kelulusan</h3>
    <label for="nama">Nama Mahasiswa:</label>
    <input type="text" id="nama" />
    <br />
    <label for="nilai">Masukkan Nilai:</label>
    <input type="number" id="nilai"/>
    <br />
    <button id="btnHitung">Cek Nilai</button>
    <p id="hasilNilai" class="hasil">
        Hasil kelulusan akan ditampilkan di sini.
    </p>
</body>
</html>
